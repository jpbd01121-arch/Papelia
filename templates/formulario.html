
{% extends 'plantilla.html' %}

{% block titulo %}Registro | Papelia{% endblock %}

{% block cabecera %}Crear una cuenta{% endblock %}

{% block contenido %}

<section class="registro card shadow-sm p-4">

    <div class="text-center mb-4">

        <i class="fas fa-user-plus fa-3x" style="color: var(--color-principal);"></i>

        <h2 class="mt-3">Registro de usuario</h2>

        <p>Completa los siguientes datos para crear tu cuenta.</p>

    </div>

    <form action="{{ url_for('registro') }}" method="POST">

        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="mb-3">

            <label for="nombre" class="form-label">Nombre completo</label>

            <input
                type="text"
                class="form-control"
                id="nombre"
                name="nombre"
                placeholder="Escribe tu nombre"
                autocomplete="name"
                maxlength="100"
                required
            >

        </div>

        <div class="mb-3">

            <label for="correo" class="form-label">Correo electrónico</label>

            <input
                type="email"
                class="form-control"
                id="correo"
                name="correo"
                placeholder="correo@ejemplo.com"
                autocomplete="email"
                maxlength="120"
                required
            >

        </div>

        <div class="mb-3">

            <label for="password" class="form-label">Contraseña</label>

            <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                placeholder="Crea una contraseña"
                autocomplete="new-password"
                minlength="8"
                required
            >

        </div>

        <div class="mb-3">

            <label for="confirmar_password" class="form-label">Confirmar contraseña</label>

            <input
                type="password"
                class="form-control"
                id="confirmar_password"
                name="confirmar_password"
                placeholder="Repite tu contraseña"
                autocomplete="new-password"
                minlength="8"
                required
            >

        </div>

        <button type="submit" class="btn btn-papelia w-100 mt-2">Crear cuenta</button>

    </form>

    <p class="text-center mt-3 mb-0">¿Ya tienes una cuenta?<a href="{{ url_for('login') }}">Inicia sesión</a></p>

</section>

{% endblock %}
