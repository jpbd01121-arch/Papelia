
{% extends 'plantilla.html' %}

{% block titulo %}Mi perfil | Papelia{% endblock %}

{% block cabecera %}Mi perfil{% endblock %}

{% block contenido %}

<section class="card shadow-sm p-4">

    <div class="text-center mb-4">

        <i class="fas fa-user-circle fa-4x" style="color: var(--color-principal);"></i>

        <h2 class="mt-3">Información de mi cuenta</h2>

        <p>Consulta los datos de tu usuario.</p>

    </div>

    <div class="row g-3">

        <div class="col-md-6">

            <label class="form-label fw-bold">Nombre completo</label>

            <div class="form-control bg-light">{{ usuario.nombre }}</div>

        </div>

        <div class="col-md-6">

            <label class="form-label fw-bold">Correo electrónico</label>

            <div class="form-control bg-light">{{ usuario.correo }}</div>

        </div>

        <div class="col-md-6">

            <label class="form-label fw-bold">Rol del usuario</label>

            <div class="form-control bg-light">{{ usuario.rol }}</div>

        </div>

    </div>

    <div class="text-center mt-4">

        <a href="{{ url_for('logout') }}"
           class="btn btn-outline-danger">
            <i class="fas fa-sign-out-alt"></i>
            Cerrar sesión
        </a>

    </div>

</section>

{% endblock %}
